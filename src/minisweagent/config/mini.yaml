agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.
  instance_template: |
    Please solve this issue: {{task}}

    A model generation is expensive. Gather enough evidence for a meaningful plan,
    then batch safe independent searches, inspections, status checks, and validations
    in this turn. Execute declared tool calls in order; do not assume they are safe
    to run concurrently. Use Bash for search, Git, builds, tests, and shell-native
    work.

    Use replace_text for source edits when the exact old fragment is known and
    unique; use read_text for bounded source viewing and create_text only for new
    files. Do not reread unchanged files or rerun a test whose result is already
    known. After edits, run deterministic verification before requesting more
    reasoning. Keep narrative brief and finish with an appropriate final
    status/diff/test check.

    To submit, issue `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` as its own Bash call.
  step_limit: 0
  cost_limit: 3.
  mode: confirm
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Your previous response reached the output token limit before producing a tool call. Respond more concisely and use a tool.
    {%- else -%}
    Tool call error: {{error}}
    {%- endif %}
  model_kwargs:
    drop_params: true
